{{define "content"}}
<div class="login-card">
  <h1>Webhook2Any</h1>
  <p class="muted">登录管理后台</p>
  <form method="post" action="/login">
    <label><span>用户名</span><input type="text" name="username" autocomplete="username" autofocus required></label>
    <label><span>密码</span><input type="password" name="password" autocomplete="current-password" required></label>
    <button class="primary" type="submit">登录</button>
  </form>
</div>
{{end}}
