{{/* 一栏「选源」列表。接收侧和发送侧共用这一段，靠 rulePicker 里的几个字段区分。
     注意整栏不能套在 <label> 里：按 HTML 的规则，一个 label 只认它里面第一个表单控件，
     那样点栏目标题、点列表空白都会去勾第一项（实测过）。

     每一项自己是一个 <label>，整行可点，没有 JS 也照常勾选提交。 */}}
{{define "picker"}}
<div class="picker-col" id="pick-{{.Role}}" data-picker="{{.Role}}">
  <div class="picker-head">
    <span class="picker-title">{{.Title}}</span>
    <span class="picker-count" data-picker-count>{{if .Count}}已选 {{.Count}} 个{{else}}未选择{{end}}</span>
  </div>
  <p class="picker-hint">{{.Hint}}</p>

  {{/* 只有两三项时这些工具是噪音，等源多起来再出现 */}}
  {{if gt (len .Options) 2}}
  <div class="picker-tools" data-picker-tools hidden>
    {{if gt (len .Options) 6}}
    <input type="search" data-picker-search placeholder="搜索源" autocomplete="off" aria-label="搜索{{.RoleText}}源">
    {{end}}
    <button type="button" class="btn sm" data-picker-all>全选</button>
    <button type="button" class="btn sm" data-picker-none>清空</button>
  </div>
  {{end}}

  {{if .Options}}
  <div class="picker">
    {{range .Options}}
    <label class="pick" data-search="{{.Name}} {{.Slug}} {{kindText .Kind}} {{usageText .Usage}}">
      <input type="checkbox" name="{{$.Input}}" value="{{.ID}}" {{if .Checked}}checked{{end}}>
      <span class="pick-body">
        <span class="pick-line">
          <span class="pick-name">{{.Name}}</span>
          {{if not .Enabled}}<span class="tag off">已停用</span>{{end}}
          <span class="tag">{{kindText .Kind}}</span>
          <span class="tag usage-{{.Usage}}">{{usageText .Usage}}</span>
        </span>
        {{if not .Eligible}}<span class="pick-warn">{{.Warn}}</span>{{end}}
      </span>
    </label>
    {{end}}
  </div>
  <div class="picker-empty muted" data-picker-empty hidden>没有匹配的源</div>
  {{else}}
  <div class="picker-empty muted">没有可用作{{.Title}}的源。</div>
  {{end}}

  {{if .Hidden}}
  <p class="picker-hidden">另有 {{.Hidden}} 个源用途不含{{.RoleText}}，没有列出来。</p>
  {{end}}
</div>
{{end}}

{{define "content"}}
<div class="page-head">
  <h1>{{if .IsNew}}新建规则{{else}}编辑规则{{end}}</h1>
  <a class="btn" href="/rules">返回</a>
</div>

<form method="post" action="{{if .IsNew}}/rules{{else}}/rules/{{.Rule.ID}}{{end}}">

<div class="panel">
  <h2>基本信息</h2>
  <label><span>规则名称</span><input type="text" name="name" value="{{.Rule.Name}}" required></label>
  <div class="checkbox-line">
    <input type="checkbox" id="enabled" name="enabled" value="1" {{if .Rule.Enabled}}checked{{end}}>
    <label for="enabled">启用该规则</label>
  </div>
</div>

<div class="panel">
  <h2>接收源 → 目标源</h2>
  {{if .NoSource}}
  <div class="note">还没有源，先去「源」页面创建，再回来建规则。</div>
  {{else}}
  <div class="grid2">
    {{range .Pickers}}{{template "picker" .}}{{end}}
  </div>
  {{end}}
</div>

<div class="panel">
  <h2>过滤条件</h2>

  {{/* 这里真正提交的是那个文本框（一行一条的文本格式），可视化编辑器只是它的一个视图：
       改行会重写文本框，反之亦然。所以没有 JS 时页面照旧能用，服务端也不用认第二种格式。 */}}
  <div class="filter-editor" data-filter-editor>
    <div class="filter-head">
      <span class="muted">全部条件都满足才转发；不添加条件时所有消息都会被转发</span>
      <button type="button" class="btn sm" data-filter-mode hidden>文本模式</button>
    </div>

    <div class="filter-visual" data-filter-visual hidden>
      <div class="filter-rows" data-filter-rows></div>
      <div class="filter-empty muted" data-filter-empty>还没有条件</div>
      <div class="filter-add">
        <button type="button" class="btn add" data-filter-add>+ 添加条件</button>
      </div>
      <div class="alert err" data-filter-error hidden></div>
    </div>

    <div class="filter-text" data-filter-text>
      <textarea name="filters" rows="6" placeholder="action eq push&#10;repository.private eq false&#10;commits.0.message contains [skip]">{{.FilterText}}</textarea>
      <div class="note">
        一行一条，格式是 <span class="mono">路径 操作符 值</span>。
        以 <span class="mono">#</span> 开头的行是注释（注释只在文本模式下保留，切回可视化会丢）。
      </div>
    </div>

    <div class="note">
      <strong>「路径」照着入站报文的 JSON 写</strong>，用点号一层层往下。
      报文是 <span class="mono">&#123;"repository":&#123;"private":false&#125;&#125;</span>，路径就写
      <span class="mono">repository.private</span>；数组用下标，<span class="mono">commits.0.id</span> 是第 1 个提交的 id。
      <br>
      <strong>「值」按 JSON 解析</strong>：<span class="mono">true</span> 是布尔、<span class="mono">123</span> 是数字、
      <span class="mono">[1,2]</span> 是数组；不加引号的裸词（比如 <span class="mono">push</span>）当字符串。
      要精确匹配带空格的值就加引号：<span class="mono">"带 空格"</span>。
      <br>
      <strong>几条条件是「全部满足」才转发</strong>，所以「带 [skip] 的不转发」要写成<strong>不包含</strong>。
      只想转发非私有仓库的 push，就是这样三条：
      <table>
        <tr><th><span class="mono">action</span></th><td>等于</td><td><span class="mono">push</span></td></tr>
        <tr><th><span class="mono">repository.private</span></th><td>等于</td><td><span class="mono">false</span></td></tr>
        <tr><th><span class="mono">commits.0.message</span></th><td>不包含</td><td><span class="mono">[skip]</span></td></tr>
      </table>
      想反过来（命中任意一条就转发）现在不支持，得拆成多条规则。
    </div>
  </div>

  <template data-filter-row-tpl>
    <div class="filter-row">
      {{/* 行号不是摆设：服务端的报错写的是「过滤器第 2 行」，有了它一眼就能对上。 */}}
      <span class="filter-idx" aria-hidden="true"></span>
      <input type="text" data-f-path placeholder="路径，如 repository.private" autocomplete="off">
      <select data-f-op>
        <option value="eq">等于</option>
        <option value="ne">不等于</option>
        <option value="gt" data-ph="数字，如 3">大于</option>
        <option value="lt" data-ph="数字，如 3">小于</option>
        <option value="contains" data-ph="子串，如 [skip]">包含</option>
        <option value="not_contains" data-ph="子串，如 [skip]">不包含</option>
        <option value="exists" data-novalue>字段存在</option>
        <option value="not_exists" data-novalue>字段不存在</option>
        <option value="regex" data-ph="正则，如 ^a/">正则匹配</option>
        <option value="in" data-ph="JSON 数组，如 [&quot;push&quot;,&quot;tag&quot;]">属于列表</option>
      </select>
      <input type="text" data-f-value placeholder="值，如 push / true / 123" autocomplete="off">
      <button type="button" class="sm danger" data-f-del>删除</button>
    </div>
  </template>
</div>

<div class="panel">
  <h2>模板转换</h2>
  <label>
    <span>报文体模板 <span class="hint">Go template 语法；留空表示原样透传入站报文</span></span>
    <textarea name="body_template" rows="7" placeholder="&#123;&#123;.Payload.repository.full_name&#125;&#125; 收到 &#123;&#123;len .Payload.commits&#125;&#125; 个提交">{{.Rule.BodyTemplate}}</textarea>
  </label>
  <label>
    <span>邮件主题模板 <span class="hint">只对邮件目标生效；留空自动生成</span></span>
    <input type="text" name="subject_template" value="{{.Rule.SubjectTemplate}}" placeholder="[&#123;&#123;.Source.name&#125;&#125;] &#123;&#123;.Payload.subject&#125;&#125;">
  </label>
  <label>
    <span>请求头模板 <span class="hint">JSON 对象，值支持模板；留空用源上配置的固定请求头</span></span>
    <textarea name="headers_template" rows="3" placeholder="&#123;&quot;X-Source&quot;: &quot;&#123;&#123;.Source.slug&#125;&#125;&quot;&#125;">{{.Rule.HeadersTemplate}}</textarea>
  </label>
  <div class="note">
    <strong>这三格留空就原样转发，不需要模板也能用。</strong>
    填了就是用 Go template 把入站报文重新拼一遍：<span class="mono">&#123;&#123; &#125;&#125;</span>
    里写变量或函数，外面的字原样保留。
    <table>
      <tr><th><span class="mono">.Payload</span></th>
        <td>入站报文解析出来的 JSON，用点号一层层往下取。报文不是 JSON 时，它是 <span class="mono">&#123;"raw": "原始报文"&#125;</span>。</td></tr>
      <tr><th><span class="mono">.Raw</span></th>
        <td>原始报文字符串，一个字都没动过的。</td></tr>
      <tr><th><span class="mono">.Source</span></th>
        <td>接收源的信息：<span class="mono">.name</span>、<span class="mono">.slug</span>、<span class="mono">.kind</span>、<span class="mono">.id</span>。</td></tr>
      <tr><th><span class="mono">.Headers</span></th>
        <td>入站请求头。邮件源里放的是 <span class="mono">Message-Id</span>、<span class="mono">Subject</span>、<span class="mono">From</span> 这些。</td></tr>
      <tr><th><span class="mono">.TraceID</span></th>
        <td>这次入站请求的追踪号，和投递日志详情页上显示的那个是同一个，排查时靠它串起来。</td></tr>
      <tr><th><span class="mono">.Now</span></th>
        <td>当前时间。<span class="mono">&#123;&#123;.Now.Format "2006-01-02 15:04"&#125;&#125;</span> 就能格式化成 <span class="mono">2026-09-20 18:30</span>。</td></tr>
    </table>
    长度、格式化这类用内置函数，比如 <span class="mono">&#123;&#123;len .Payload.commits&#125;&#125;</span>。
  </div>

  <div class="note">
    <strong>完整例子</strong>：GitHub 推过来的是
    <span class="mono">&#123;"repository":&#123;"full_name":"a/b"&#125;,"commits":[1,2,3]&#125;</span>。
    在「报文体模板」里写
    <span class="mono">&#123;&#123;.Payload.repository.full_name&#125;&#125; 收到 &#123;&#123;len .Payload.commits&#125;&#125; 个提交</span>，
    实际发出去的就是 <span class="mono">a/b 收到 3 个提交</span>。
    <br>
    <strong>两个坑</strong>：
    一是取数组元素必须写 <span class="mono">&#123;&#123;index .Payload.commits 0&#125;&#125;</span>，
    不能像上面「过滤条件」那样写 <span class="mono">.commits.0</span>（那是过滤器的语法，模板里会直接报语法错，保存时就挡下来）。
    二是「请求头模板」不是文本模板而是 <strong>JSON 对象</strong>，值里才能嵌模板，
    比如 <span class="mono">&#123;"X-Source": "&#123;&#123;.Source.slug&#125;&#125;"&#125;</span>，填错 JSON 保存时也会报错。
  </div>
</div>

<div class="actions">
  <button class="primary" type="submit">保存</button>
  <a class="btn" href="/rules">取消</a>
</div>
</form>
{{end}}
